  { key: 'recommendation', label: 'توصية الدرجة' },
  { key: 'decision', label: 'قرار القائد' },
  { key: 'contract', label: 'عقد التفويض' },
  { key: 'letter', label: 'الكتاب الرسمي' },
  { key: 'save', label: 'الحفظ والتأكيد' }
];

function emptyWizardState () {
  return {
    id: genId(),
    status: 'draft',
    wizardStep: 0,
    task: { name: '', description: '', desiredOutcome: '', startDate: todayStr(), targetDate: '', department: '', notes: '' },
    taskAssessment: { clarity: null, precedent: null, impact: null, reversibility: null, interdependency: null, sensitivities: [] },
    delegatee: { name: '', title: '', department: '' },
    readinessAssessment: { experience: null, knowledge: null, unexpectedHandling: null, judgment: null, reliability: null, independence: null, trackRecord: null },
    authorityGate: { type: '', exceptions: '' },
    recommendedLevel: null, recommendedRange: null, recommendationFactors: null,
    chosenLevel: null, overrideReason: null,
    delegationContract: { outcome: '', scope: '', authorities: '', referralBoundaries: '', resources: '', budget: '', supportPeople: '', successCriteria: '', checkpointsPlan: '' },
    completeness: null,
    officialLetter: { text: '', delegatorName: '', delegatorTitle: '', edited: false },
    checkpoints: [], interventions: [], timeline: [],
    finalEvaluation: null, nextRecommendation: null,
    createdAt: null, updatedAt: null
  };
}

function setPath (obj, path, val) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  cur[parts[parts.length - 1]] = val;
}
function getPath (obj, path) {
  return path.split('.').reduce((c, k) => (c == null ? undefined : c[k]), obj);
}
function bindFieldInputs (root) {
  qsa('[data-field]', root).forEach((elx) => {
    const path = elx.dataset.field;
    const handler = () => setPath(APP_STATE.wizard, path, elx.value);
    elx.addEventListener('input', handler);
    elx.addEventListener('change', handler);
  });
}

async function startDelegationWizard (outlet, draftId) {
  if (draftId) {
    outlet.innerHTML = '<div class="loader-dots"><span></span><span></span><span></span></div>';
    const rec = await getDelegation(draftId);
    if (!rec) { showToast('لم يتم العثور على المسودة المطلوبة.', 'danger'); navigate('#/delegations'); return; }
    if (rec.status !== 'draft') { navigate(`#/delegations/${draftId}`); return; }
    APP_STATE.wizard = Object.assign(emptyWizardState(), JSON.parse(JSON.stringify(rec)));
    if (typeof APP_STATE.wizard.wizardStep !== 'number') APP_STATE.wizard.wizardStep = 0;
  } else {
    APP_STATE.wizard = emptyWizardState();
    const prof = getDelegatorProfile();
    APP_STATE.wizard.officialLetter.delegatorName = prof.name || '';
    APP_STATE.wizard.officialLetter.delegatorTitle = prof.title || '';
  }
  renderWizardChrome(outlet);
}

function getDelegatorProfile () {
  try { return JSON.parse(localStorage.getItem('rafedDelegatorProfile') || '{}'); } catch (e) { return {}; }
}
function saveDelegatorProfile (name, title) {
  try { localStorage.setItem('rafedDelegatorProfile', JSON.stringify({ name, title })); } catch (e) { /* ignore */ }
}

async function persistWizardDraft () {
  const w = APP_STATE.wizard;
  if (!w.task.name || !w.task.name.trim()) return;
  if (!w.timeline || !w.timeline.length) pushTimelineEvent(w, 'create', 'إنشاء عملية التفويض (مسودة)');
  w.completeness = calculateCompleteness(w.delegationContract);
  try {
    await saveDelegation(w);
    await refreshDelegationsCache();
  } catch (e) { showToast('تعذر حفظ المسودة: ' + e.message, 'danger'); }
}

function isStepValid (idx) {
  const w = APP_STATE.wizard;
  switch (idx) {
    case 0: return !!(w.task.name && w.task.name.trim() && w.task.desiredOutcome && w.task.desiredOutcome.trim());
    case 1: return ['clarity', 'precedent', 'impact', 'reversibility', 'interdependency'].every((k) => w.taskAssessment[k] !== null && w.taskAssessment[k] !== undefined);
    case 2: return !!(w.delegatee.name && w.delegatee.name.trim()) && Object.keys(READINESS_FIELDS).every((k) => w.readinessAssessment[k] !== null && w.readinessAssessment[k] !== undefined);
    case 3:
      if (!w.authorityGate.type) return false;
      if (w.authorityGate.type === 'partial' && !(w.authorityGate.exceptions && w.authorityGate.exceptions.trim())) return false;
      return true;
    case 4: return true;
    case 5:
      if (typeof w.chosenLevel !== 'number') return false;
      if (w.chosenLevel !== w.recommendedLevel && (!w.overrideReason || !w.overrideReason.category)) return false;
      return true;
    case 6: return true;
    case 7: return !!(w.officialLetter.delegatorName && w.officialLetter.delegatorName.trim() && w.officialLetter.delegatorTitle && w.officialLetter.delegatorTitle.trim());
    default: return true;
  }
}

async function goToStep (idx, opts) {
  opts = opts || {};
  const w = APP_STATE.wizard;
  if (opts.validate && !isStepValid(w.wizardStep)) {
    showToast('أكمل الحقول المطلوبة في هذه الخطوة أولًا.', 'danger');
    return;
  }
  w.wizardStep = idx;
  await persistWizardDraft();
  const outlet = qs('#page-outlet');
  renderWizardChrome(outlet);
}

function renderWizardChrome (outlet) {
  const w = APP_STATE.wizard;
  const idx = w.wizardStep;
  outlet.innerHTML = `
    <div class="wizard-head">
      <div class="section-head" style="margin-bottom:14px;">
        <div>
          <div class="eyebrow">${icon('compass')} تفويض جديد</div>
          <h1 style="margin-top:4px;">${escapeHtml(w.task.name || 'بوصلة التفويض')}</h1>
        </div>
        <a href="#/delegations" class="btn btn-ghost btn-sm">${icon('close')} إلغاء والخروج</a>
      </div>
      <div class="wizard-stage-badge">${icon('bolt')} الخطوة ${idx + 1} من ${WIZARD_STEPS.length} — ${WIZARD_STEPS[idx].label}</div>
      <div class="wizard-progress">
        ${WIZARD_STEPS.map((s, i) => `<div class="wp-seg ${i < idx ? 'done' : i === idx ? 'current' : ''}"><i></i></div>`).join('')}
      </div>
    </div>
    <div class="card pad-lg">
      <div class="wizard-body" id="wizard-body"></div>
      <div class="wizard-nav">
        <div class="side-actions">
          ${idx > 0 ? `<button class="btn btn-secondary" id="wiz-back">${icon('back')} السابق</button>` : '<span></span>'}
        </div>
        <div class="side-actions">
          <button class="btn btn-ghost" id="wiz-save-exit">حفظ كمسودة والخروج</button>
          ${idx < WIZARD_STEPS.length - 1
            ? `<button class="btn btn-primary" id="wiz-next">التالي ${icon('back')}</button>`
            : `<button class="btn btn-primary" id="wiz-finish">${icon('check')} اعتماد وحفظ التفويض</button>`}
        </div>
      </div>
    </div>
  `;

  const body = qs('#wizard-body');
  STEP_RENDERERS[idx](body, w);

  if (qs('#wiz-back')) qs('#wiz-back').addEventListener('click', () => goToStep(idx - 1));
  qs('#wiz-next') && qs('#wiz-next').addEventListener('click', () => goToStep(idx + 1, { validate: true }));
  qs('#wiz-save-exit').addEventListener('click', async () => {
    if (!w.task.name || !w.task.name.trim()) { showToast('أدخل اسم المهمة على الأقل قبل الحفظ كمسودة.', 'danger'); return; }
    await persistWizardDraft();
    showToast('تم حفظ التفويض كمسودة، ويمكنك العودة إليه لاحقًا من صفحة التفويضات.');
    navigate('#/delegations');
  });
  if (qs('#wiz-finish')) qs('#wiz-finish').addEventListener('click', finalizeWizard);
}

    ${scaleBlock('impact', 'ما حجم أثر الخطأ إذا وقع في هذه المهمة؟')}
    ${scaleBlock('reversibility', 'ما مدى قابلية التراجع عن القرار المتخذ فيها؟')}

        ${SENSITIVITY_OPTIONS.map((o) => `<label class="checkbox-pill ${a.sensitivities.includes(o.key) ? 'selected' : ''}" data-key="${o.key}">
          <input type="checkbox" ${a.sensitivities.includes(o.key) ? 'checked' : ''}> ${o.label}
        </label>`).join('')}
      </div>
    </div>
  `;
  ['clarity', 'precedent', 'impact', 'reversibility', 'interdependency'].forEach((key) => {
    qsa(`[data-group="${key}"] .scale-opt`, body).forEach((optEl) => {
      optEl.addEventListener('click', () => {
        qsa(`[data-group="${key}"] .scale-opt`, body).forEach((o) => o.classList.remove('selected'));

/* ---------------- الخطوة 4: بوابة الصلاحية ---------------- */
function renderStepGate (body, w) {
  const g = w.authorityGate;
  const descriptions = {
    full: 'تملك الصلاحية الكاملة لتفويض جميع القرارات المرتبطة بهذه المهمة.',
    partial: 'تملك صلاحية تفويض جزء من القرارات، وتحتفظ ببعضها لنفسك.',
    none: 'لا تملك صلاحية تفويض قرار هذه المهمة، لكن يمكنك تفويض البحث أو الإعداد أو التنفيذ.'
  };
  body.innerHTML = `
    <h3 class="mb-8">بوابة الصلاحية</h3>
    <p class="mb-16">إلى أي مدى تملك صلاحية تفويض القرارات المرتبطة بهذه المهمة؟</p>
    <div class="choice-group mb-16">
      ${AUTHORITY_GATE_OPTIONS.map((o) => `
        <label class="choice-card ${g.type === o.key ? 'selected' : ''}" data-gate="${o.key}">
          <input type="radio" name="gate" value="${o.key}" ${g.type === o.key ? 'checked' : ''}>
          <div><div class="cc-title">${o.label}</div><div class="cc-desc">${descriptions[o.key]}</div></div>
        </label>`).join('')}
    </div>
    <div id="gate-extra"></div>
  `;
  const renderExtra = () => {
    const extra = qs('#gate-extra', body);
    if (g.type === 'partial') {
      extra.innerHTML = `<div class="field"><label>حدد القرارات أو الحالات التي يجب الرجوع إليك فيها <span class="req">*</span></label>
        <textarea data-field="authorityGate.exceptions" rows="3" placeholder="مثال: أي قرار يتجاوز 5,000 ريال، أو التعاقد مع جهات خارجية جديدة">${escapeHtml(g.exceptions)}</textarea></div>`;
      bindFieldInputs(extra);
    } else if (g.type === 'none') {
      extra.innerHTML = `<div class="callout warning">${icon('lock')}<div><strong>لا تستطيع أن تفوّض صلاحية لا تملكها.</strong><br>لن تقترح البوصلة مستوى تفويض يتجاوز «أوصِ وانتظر»، مع إمكانية تفويض البحث أو الإعداد أو التنفيذ ضمن هذا الحد.</div></div>`;
    } else {
      extra.innerHTML = '';
    }
  };
  renderExtra();
  qsa('.choice-card', body).forEach((cardEl) => {
    cardEl.addEventListener('click', () => {
      qsa('.choice-card', body).forEach((c) => c.classList.remove('selected'));
      cardEl.classList.add('selected');
      qs('input', cardEl).checked = true;
      g.type = cardEl.dataset.gate;
      if (g.type !== 'partial') g.exceptions = g.exceptions || '';
      renderExtra();
    });
  });
}

/* ---------------- الخطوة 5: توصية الدرجة ---------------- */
function renderStepRecommendation (body, w) {
  const taskA = calculateTaskRisk(w.taskAssessment);
  const readinessA = calculateReadiness(w.readinessAssessment);
  w.taskAssessment.risk = taskA.risk; w.taskAssessment.riskExplanation = taskA.explanation; w.taskAssessment.riskScore = taskA.score;
  w.readinessAssessment.readiness = readinessA.readiness; w.readinessAssessment.readinessExplanation = readinessA.explanation; w.readinessAssessment.readinessScore = readinessA.score;
  const rec = recommendDelegationLevel(taskA, readinessA, w.authorityGate);
  w.recommendedLevel = rec.level; w.recommendedRange = rec.range;
  w.recommendationFactors = { supporting: rec.supporting, caution: rec.caution, gateCapped: rec.gateCapped };
  if (typeof w.chosenLevel !== 'number') w.chosenLevel = rec.level;

  const step = ladderStep(rec.level);
  body.innerHTML = `
    <h3 class="mb-16">توصية درجة التفويض</h3>
    <div class="grid grid-2 mb-16">
      <div class="callout ${taskA.risk === 'high' ? 'danger' : taskA.risk === 'medium' ? 'warning' : 'info'}">
        ${icon('shield')}
        <div><strong>مخاطرة المهمة: ${RISK_LABELS_AR[taskA.risk]}</strong><br><span class="small">${taskA.explanation}</span></div>
      </div>
      <div class="callout ${readinessA.readiness === 'high' ? 'info' : readinessA.readiness === 'medium' ? 'warning' : 'danger'}">
        ${icon('users')}
        <div><strong>جاهزية المفوَّض إليه: ${READINESS_LABELS_AR[readinessA.readiness]}</strong><br><span class="small">${readinessA.explanation}</span></div>
      </div>
    </div>

    <div class="card-soft text-center mb-16" style="padding:30px;">
      <div class="eyebrow">الدرجة المقترحة</div>
      <div style="font-size:3rem;font-weight:900;color:var(--rafed-dark-green);line-height:1;margin:10px 0;">${rec.level} <span style="font-size:1.3rem;color:var(--rafed-muted);">من 7</span></div>
      <div style="font-size:1.2rem;font-weight:800;color:var(--rafed-gold-strong);">${step.title}</div>
      <p class="muted" style="max-width:520px;margin:8px auto 0;">«${step.phrase}»</p>
      ${rec.gateCapped ? `<p class="small" style="color:var(--rafed-danger);margin-top:10px;">تم تعديل التوصية بسبب حدود صلاحيتك في بوابة الصلاحية.</p>` : ''}
    </div>

    <div class="grid grid-2 mb-16">
      <div class="card pad-sm">
        <h4 class="mb-8">لماذا هذه الدرجة؟ — عوامل داعمة</h4>
        <ul style="margin:0;padding-inline-start:20px;">${rec.supporting.map((s) => `<li class="small mb-8">${escapeHtml(s)}</li>`).join('')}</ul>
      </div>
      <div class="card pad-sm">
        <h4 class="mb-8">عوامل تستدعي الحذر</h4>
        <ul style="margin:0;padding-inline-start:20px;">${rec.caution.map((s) => `<li class="small mb-8">${escapeHtml(s)}</li>`).join('')}</ul>
      </div>
    </div>

    <h4 class="mb-8">سلم التفويض السباعي كاملًا</h4>
    ${renderLadderFull({ recommendedLevel: rec.level, chosenLevel: null, clickable: false, gateMax: w.authorityGate.type === 'none' ? 4 : null })}
  `;
}

/* ---------------- الخطوة 6: قرار القائد ---------------- */
function renderStepDecision (body, w) {
  const gateMax = w.authorityGate.type === 'none' ? 4 : null;
  body.innerHTML = `
    <h3 class="mb-8">قرار القائد</h3>
    <p class="muted mb-16">البوصلة تساعد ولا تستبدل تقديرك. اعتمد الدرجة المقترحة أو اختر درجة أخرى وسجّل السبب.</p>
    <div class="btn-row mb-16">
      <button class="btn btn-primary" id="accept-rec">${icon('check')} اعتماد الدرجة المقترحة (${w.recommendedLevel})</button>
    </div>
    ${renderLadderFull({ recommendedLevel: w.recommendedLevel, chosenLevel: w.chosenLevel, clickable: true, gateMax })}
    <div id="override-block" class="mt-16"></div>
  `;
  const renderOverrideBlock = () => {
    const blockEl = qs('#override-block', body);
    if (w.chosenLevel !== w.recommendedLevel) {
      if (!w.overrideReason) w.overrideReason = { category: '', note: '' };
      blockEl.innerHTML = `
        <div class="card-soft">
          <p class="mb-12" style="font-weight:800;color:var(--rafed-dark-green);">ما الذي يدفعك لاختيار درجة مختلفة عن التوصية؟</p>
          <div class="pill-wrap mb-12" id="override-pills">
            ${OVERRIDE_REASONS.map((r) => `<label class="checkbox-pill ${w.overrideReason.category === r ? 'selected' : ''}" data-reason="${r}"><input type="radio" name="override" ${w.overrideReason.category === r ? 'checked' : ''}> ${r}</label>`).join('')}
          </div>
          <div class="field" style="margin-bottom:0;"><label>ملاحظة إضافية (اختياري)</label><textarea data-field="overrideReason.note" rows="2">${escapeHtml(w.overrideReason.note || '')}</textarea></div>
        </div>`;
      bindFieldInputs(blockEl);
      qsa('.checkbox-pill', qs('#override-pills', blockEl)).forEach((pill) => {
        pill.addEventListener('click', (e) => {
          e.preventDefault();
          qsa('.checkbox-pill', qs('#override-pills', blockEl)).forEach((p) => { p.classList.remove('selected'); qs('input', p).checked = false; });
          pill.classList.add('selected'); qs('input', pill).checked = true;
          w.overrideReason.category = pill.dataset.reason;
        });
      });
    } else {
      blockEl.innerHTML = '';
      w.overrideReason = null;
    }
  };
  renderOverrideBlock();
  qs('#accept-rec', body).addEventListener('click', () => {
    w.chosenLevel = w.recommendedLevel;
    w.overrideReason = null;
    renderStepDecision(body, w);
  });
  qsa('.ladder-step', body).forEach((stepEl) => {
    const lvl = Number(stepEl.dataset.level);
    if (gateMax && lvl > gateMax) {
      stepEl.addEventListener('click', () => showToast('هذا المستوى يتجاوز نطاق صلاحيتك المحددة في بوابة الصلاحية.', 'danger'));
      return;
    }
    stepEl.classList.add('is-clickable');
    stepEl.addEventListener('click', () => { w.chosenLevel = lvl; renderStepDecision(body, w); });
  });
}

    <div class="field"><label>حدود الرجوع للقائد</label><textarea data-field="delegationContract.referralBoundaries" rows="3">${escapeHtml(c.referralBoundaries)}</textarea><div class="hint">متى يجب التوقف والرجوع إلى القائد؟</div></div>
    <div class="field-grid">
      <div class="field"><label>الموارد المتاحة</label><textarea data-field="delegationContract.resources" rows="2">${escapeHtml(c.resources)}</textarea></div>
      <div class="field"><label>الميزانية (إن وجدت)</label><input type="text" data-field="delegationContract.budget" value="${escAttr(c.budget)}"></div>
      <div class="field" style="grid-column:1/-1;"><label>الأشخاص أو الفرق الداعمة</label><input type="text" data-field="delegationContract.supportPeople" value="${escAttr(c.supportPeople)}"></div>
    </div>
    <div class="field"><label>معيار النجاح</label><textarea data-field="delegationContract.successCriteria" rows="2">${escapeHtml(c.successCriteria)}</textarea><div class="hint">كيف نعرف أن المهمة أُنجزت بالمستوى المطلوب؟</div></div>
    <div class="field"><label>خطة المتابعة العامة (اختياري)</label><textarea data-field="delegationContract.checkpointsPlan" rows="2" placeholder="مثال: تحديث أسبوعي مختصر كل يوم أحد">${escapeHtml(c.checkpointsPlan)}</textarea></div>

    <div class="hr"></div>
    <div class="section-head" style="margin-bottom:12px;">
      <h4 style="margin:0;">نقاط المتابعة المحددة</h4>
      <button class="btn btn-secondary btn-sm" id="add-cp-btn">${icon('plus')} إضافة نقطة متابعة</button>
    </div>
    <div id="cp-form-wrap"></div>
    <div id="cp-list" class="list-cards"></div>

    <div class="mt-16" id="completeness-wrap"></div>
  `;
  bindFieldInputs(body);
  renderCpList();
  renderCompletenessWrap();

  qs('#add-cp-btn', body).addEventListener('click', () => {
    const wrap = qs('#cp-form-wrap', body);
    wrap.innerHTML = `
      <div class="card-soft mb-16">
        <div class="field-grid">
          <div class="field"><label>التاريخ</label><input type="date" id="cp-date"></div>
          <div class="field"><label>نوع المتابعة</label><select id="cp-type">${CHECKPOINT_TYPES.map((t) => `<option>${t}</option>`).join('')}</select></div>
          <div class="field" style="grid-column:1/-1;"><label>الموضوع</label><input type="text" id="cp-topic" placeholder="مثال: تحديث حول مرحلة الإعداد"></div>
        </div>
        <div class="btn-row"><button class="btn btn-primary btn-sm" id="cp-save">${icon('check')} إضافة</button><button class="btn btn-ghost btn-sm" id="cp-cancel">إلغاء</button></div>
      </div>`;
    qs('#cp-cancel', wrap).addEventListener('click', () => { wrap.innerHTML = ''; });
    qs('#cp-save', wrap).addEventListener('click', () => {
      const date = qs('#cp-date', wrap).value;
      const type = qs('#cp-type', wrap).value;
      const topic = qs('#cp-topic', wrap).value.trim();
      if (!topic) { showToast('أدخل موضوع نقطة المتابعة.', 'danger'); return; }
      addCheckpoint(w, { date, type, topic });
      wrap.innerHTML = '';
      renderCpList();
    });
  });

  function renderCpList () {
    const listEl = qs('#cp-list', body);
    if (!w.checkpoints.length) { listEl.innerHTML = '<p class="muted small">لم تُضف نقاط متابعة بعد.</p>'; return; }
    listEl.innerHTML = w.checkpoints.map((cp) => `
      <div class="cp-item">
        <div class="cp-head">
          <span class="cp-title">${escapeHtml(cp.topic)}</span>
          <button class="btn btn-icon btn-ghost btn-sm" data-remove-cp="${cp.id}" aria-label="حذف">${icon('trash')}</button>
        </div>
        <div class="small muted">${cp.type} ${cp.date ? '— ' + formatDateShort(cp.date) : ''}</div>
      </div>`).join('');
    qsa('[data-remove-cp]', listEl).forEach((btn) => btn.addEventListener('click', () => {
      w.checkpoints = w.checkpoints.filter((c) => c.id !== btn.dataset.removeCp);
      renderCpList();
    }));
  }

  function renderCompletenessWrap () {
    const comp = calculateCompleteness(w.delegationContract);
    w.completeness = comp;
    const wrapEl = qs('#completeness-wrap', body);
    wrapEl.innerHTML = `<div class="flex items-center gap-10" style="flex-wrap:wrap;">${renderCompletenessChip(comp)}
      ${comp.missing.length ? `<span class="small muted">العناصر الناقصة: ${comp.missing.join('، ')}</span>` : '<span class="small muted">جميع عناصر العقد الأساسية مكتملة.</span>'}</div>`;
  }

  // إعادة حساب الاكتمال عند أي تغيير نصي
  body.addEventListener('input', debounce(renderCompletenessWrap, 300));
}

function renderStepLetter (body, w) {
  if (!w.officialLetter.text || !w.officialLetter.edited) {
    w.officialLetter.text = generateOfficialLetter(w, { name: w.officialLetter.delegatorName, title: w.officialLetter.delegatorTitle });
  }
  const comp = w.completeness || calculateCompleteness(w.delegationContract);

  body.innerHTML = `
    <h3 class="mb-8">الكتاب الرسمي</h3>
    <div class="mb-16">${renderCompletenessChip(comp)}</div>
    <div class="field-grid mb-16">
      <div class="field"><label>اسمك (المفوِّض) <span class="req">*</span></label><input type="text" id="delegator-name" value="${escAttr(w.officialLetter.delegatorName)}"></div>
      <div class="field"><label>مسماك الوظيفي <span class="req">*</span></label><input type="text" id="delegator-title" value="${escAttr(w.officialLetter.delegatorTitle)}"></div>
    </div>
    <div class="btn-row mb-16">
      <button class="btn btn-secondary btn-sm" id="letter-regen">${icon('bolt')} إعادة التوليد من العقد</button>
      <button class="btn btn-secondary btn-sm" id="letter-edit-toggle">${icon('edit')} تعديل النص</button>
      <button class="btn btn-secondary btn-sm" id="letter-copy">${icon('copy')} نسخ الكتاب</button>
      <button class="btn btn-secondary btn-sm" id="letter-print">${icon('print')} طباعة الكتاب</button>
      <button class="btn btn-secondary btn-sm" id="letter-mail">${icon('mail')} تجهيز للبريد الإلكتروني</button>
    </div>
    <div id="letter-view"></div>
  `;

  const renderLetterView = (editMode) => {
    const viewEl = qs('#letter-view', body);
    if (editMode) {
      viewEl.innerHTML = `<textarea class="letter-edit-area" id="letter-textarea">${escapeHtml(w.officialLetter.text)}</textarea>`;
      qs('#letter-textarea', viewEl).addEventListener('input', (e) => { w.officialLetter.text = e.target.value; w.officialLetter.edited = true; });
    } else {
      viewEl.innerHTML = `<div class="letter-preview">
        <div class="letter-head"><img src="${RAFED_LOGO}" alt="شعار رافد"><div class="lh-meta">رافد لتصميم البرمجيات الخاصة<br>بوصلة التفويض</div></div>
        <div class="letter-body-text">${escapeHtml(w.officialLetter.text)}</div>
      </div>`;
    }
  };
  renderLetterView(false);

  qs('#delegator-name', body).addEventListener('input', (e) => { w.officialLetter.delegatorName = e.target.value; });
  qs('#delegator-title', body).addEventListener('input', (e) => { w.officialLetter.delegatorTitle = e.target.value; });
  qs('#delegator-name', body).addEventListener('blur', () => saveDelegatorProfile(w.officialLetter.delegatorName, w.officialLetter.delegatorTitle));
  qs('#delegator-title', body).addEventListener('blur', () => saveDelegatorProfile(w.officialLetter.delegatorName, w.officialLetter.delegatorTitle));

  let editing = false;
  qs('#letter-edit-toggle', body).addEventListener('click', () => { editing = !editing; renderLetterView(editing); qs('#letter-edit-toggle', body).innerHTML = editing ? `${icon('check')} تم` : `${icon('edit')} تعديل النص`; });
  qs('#letter-regen', body).addEventListener('click', () => {
    w.officialLetter.edited = false;
    w.officialLetter.text = generateOfficialLetter(w, { name: w.officialLetter.delegatorName, title: w.officialLetter.delegatorTitle });
    editing = false; renderLetterView(false);
    showToast('تمت إعادة توليد الكتاب من بيانات العقد الحالية.');
  });
  qs('#letter-copy', body).addEventListener('click', async () => {
    const ok = await copyTextToClipboard(w.officialLetter.text);
    showToast(ok ? 'تم نسخ نص الكتاب.' : 'تعذر النسخ التلقائي؛ حدد النص وانسخه يدويًا.', ok ? undefined : 'danger');
  });
  qs('#letter-print', body).addEventListener('click', () => printOfficialLetter(w));
  qs('#letter-mail', body).addEventListener('click', () => { window.location.href = buildMailtoLink(w, w.officialLetter.text); });
}

  `;
}

const STEP_RENDERERS = [
  renderStepTask, renderStepDiagnosis, renderStepReadiness, renderStepGate,
  renderStepRecommendation, renderStepDecision, renderStepContract, renderStepLetter, renderStepSave
];

function renderLadderFull (opts) {
  opts = opts || {};
  const { recommendedLevel, chosenLevel, clickable, gateMax } = opts;
  return `<div class="ladder">${DELEGATION_LADDER.map((s) => {
    const disabled = gateMax && s.level > gateMax;
    let cls = 'ladder-step';
    if (clickable && !disabled) cls += ' is-clickable';
    if (chosenLevel === s.level) cls += ' chosen';
    else if (recommendedLevel === s.level) cls += ' recommended';
    return `<div class="${cls}" data-level="${s.level}" ${disabled ? 'style="opacity:.5;"' : ''}>
      <div class="ls-num">${s.level}</div>
      <div class="ls-body">
        <div class="ls-title">${s.title}${disabled ? ' <span class="tiny muted">(خارج نطاق صلاحيتك الحالية)</span>' : ''}</div>
        <div class="ls-phrase">«${s.phrase}»</div>
      </div>
      <div class="ls-tags">
        ${recommendedLevel === s.level ? '<span class="badge badge-gold">مقترحة</span>' : ''}
        ${chosenLevel === s.level ? '<span class="badge badge-green">معتمدة</span>' : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

async function finalizeWizard () {
  const w = APP_STATE.wizard;
  const comp = calculateCompleteness(w.delegationContract);
  const doFinalize = async () => {
    changeDelegationStatus(w, 'active', 'اعتماد التفويض');
    pushTimelineEvent(w, 'level-decision', `اعتماد درجة التفويض: ${w.chosenLevel} (${ladderStep(w.chosenLevel).title})`);
    if (!w.officialLetter.text) w.officialLetter.text = generateOfficialLetter(w, { name: w.officialLetter.delegatorName, title: w.officialLetter.delegatorTitle });
    pushTimelineEvent(w, 'letter', 'توليد الكتاب الرسمي للتفويض');
    w.completeness = comp;
    saveDelegatorProfile(w.officialLetter.delegatorName, w.officialLetter.delegatorTitle);
    try {
      await saveDelegation(w);
      await refreshDelegationsCache();
      showToast('تم حفظ التفويض، ويمكنك العودة إليه في أي وقت من هذا الجهاز.');
      navigate(`#/delegations/${w.id}`);
    } catch (e) {
      showToast('تعذر حفظ التفويض: ' + e.message, 'danger');
    }
  };

  if (comp.status === 'review') {
    confirmAction({
      title: 'عقد التفويض غير مكتمل بعد',
      body: `العناصر الناقصة: ${comp.missing.join('، ')}. يمكنك المتابعة الآن وإكمالها لاحقًا من صفحة تفاصيل التفويض، أو العودة لإكمالها الآن.`,
      confirmLabel: 'المتابعة رغم النقص', cancelLabel: 'العودة للتعديل',
      onConfirm: doFinalize
    });
  } else {
    await doFinalize();
  }
}

/* ================= قائمة التفويضات ================= */
function renderDelegationsList (outlet) {

  });
  qs('#f-from').addEventListener('change', (e) => { APP_STATE.filters.from = e.target.value; rerenderResults(); });
  qs('#f-to').addEventListener('change', (e) => { APP_STATE.filters.to = e.target.value; rerenderResults(); });
  qs('#dl-sort').addEventListener('change', (e) => { APP_STATE.filters.sort = e.target.value; rerenderResults(); });
  qs('#dl-reset').addEventListener('click', resetFilters);

  rerenderResults();

  function bindDelegationCardClicks () {
    qsa('.deleg-card', qs('#dl-results')).forEach((cardEl) => cardEl.addEventListener('click', () => navigate(`#/delegations/${cardEl.dataset.id}`)));

function resetFilters () {
  APP_STATE.filters = { q: '', status: '', delegatee: '', level: '', risk: '', readiness: '', from: '', to: '', sort: 'newest' };
  renderDelegationsList(qs('#page-outlet'));
}

function applyDelegationFilters () {
  const f = APP_STATE.filters;
  let list = APP_STATE.delegations.slice();
  if (f.q && f.q.trim()) {
    const q = f.q.trim().toLowerCase();
    list = list.filter((d) => (d.task && d.task.name || '').toLowerCase().includes(q) || (d.delegatee && d.delegatee.name || '').toLowerCase().includes(q));
  }
  if (f.status) list = list.filter((d) => d.status === f.status);
  if (f.delegatee) list = list.filter((d) => d.delegatee && d.delegatee.name === f.delegatee);
  if (f.level) list = list.filter((d) => d.chosenLevel === Number(f.level));
  if (f.risk) list = list.filter((d) => d.taskAssessment && d.taskAssessment.risk === f.risk);
  if (f.readiness) list = list.filter((d) => d.readinessAssessment && d.readinessAssessment.readiness === f.readiness);
  if (f.from) list = list.filter((d) => (d.createdAt || '').slice(0, 10) >= f.from);
  if (f.to) list = list.filter((d) => (d.createdAt || '').slice(0, 10) <= f.to);

  switch (f.sort) {
    case 'oldest': list.sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || '')); break;
    case 'level': list.sort((a, b) => (b.chosenLevel || 0) - (a.chosenLevel || 0)); break;
    case 'deadline': list.sort((a, b) => (a.task && a.task.targetDate || '9999').localeCompare(b.task && b.task.targetDate || '9999')); break;
    default: list.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  }
  return list;
}

function renderDelegationResultsHtml (list) {
  if (!list.length) {
    return `<div class="empty-state"><div class="es-icon">${icon('search')}</div><h3>لا توجد نتائج مطابقة</h3><p>جرّب تعديل كلمة البحث أو إعادة ضبط الفلاتر.</p></div>`;
  }
  return `<div class="list-cards">${list.map(delegationCardHtml).join('')}</div>`;
}

async function renderDelegationDetails (outlet, id) {
  outlet.innerHTML = '<div class="loader-dots"><span></span><span></span><span></span></div>';

  if (!record) {

  }
  let activeTab = APP_STATE.pendingTab === 'followup' ? 'followup' : 'overview';

  const persist = async (patch) => {

    await saveDelegation(record);

  };

  const rerender = () => renderDetailShell();

  function renderDetailShell () {

        <div>
          <div class="flex items-center gap-10 mb-8" style="flex-wrap:wrap;">
            <span class="badge ${STATUS_BADGE_CLASS[record.status]}"><span class="badge-dot"></span>${STATUS_LABELS_AR[record.status]}</span>

            ${record.taskAssessment ? `<span class="badge ${RISK_BADGE_CLASS[record.taskAssessment.risk]}">مخاطرة ${RISK_LABELS_AR[record.taskAssessment.risk]}</span>` : ''}
          </div>
          <h1>${escapeHtml(record.task.name)}</h1>
          <div class="muted">المفوَّض إليه: ${escapeHtml(record.delegatee.name)} ${record.delegatee.title ? '— ' + escapeHtml(record.delegatee.title) : ''}</div>
        </div>
        <div class="btn-row" id="detail-actions"></div>

      ${pseudo ? `<div class="callout warning mb-16">${icon('warn')}<div><strong>ملاحظة تطويرية:</strong> يبدو أن مساحة الاستقلالية الفعلية أقل من الدرجة المعلنة. قد يكون من المفيد مراجعة نقاط الرجوع والتدخل.</div></div>` : ''}

      <div class="tabs" id="detail-tabs">
        ${DETAIL_TABS.map((t) => `<button data-tab="${t.key}" class="${activeTab === t.key ? 'active' : ''}">${t.label}</button>`).join('')}
      </div>
      <div id="tab-content"></div>
    `;

    renderDetailActions();
    qsa('#detail-tabs button').forEach((btn) => btn.addEventListener('click', () => { activeTab = btn.dataset.tab; rerender(); }));
    renderTabContent();
  }

  function renderDetailActions () {
    const wrap = qs('#detail-actions');
    const buttons = [];
    if (record.status === 'active') {
      buttons.push(`<button class="btn btn-secondary btn-sm" data-act="pause">تعليق</button>`);
      buttons.push(`<button class="btn btn-secondary btn-sm" data-act="cancel">إلغاء</button>`);
    } else if (record.status === 'paused') {
      buttons.push(`<button class="btn btn-secondary btn-sm" data-act="resume">استئناف</button>`);
      buttons.push(`<button class="btn btn-secondary btn-sm" data-act="cancel">إلغاء</button>`);
    } else if (record.status === 'completed' || record.status === 'cancelled') {
      buttons.push(`<button class="btn btn-secondary btn-sm" data-act="archive">أرشفة</button>`);
    } else if (record.status === 'archived') {
      buttons.push(`<button class="btn btn-secondary btn-sm" data-act="unarchive">إلغاء الأرشفة</button>`);
    }
    buttons.push(`<button class="btn btn-secondary btn-sm" data-act="print-report">${icon('print')} تقرير هذا التفويض</button>`);
    buttons.push(`<button class="btn btn-danger btn-sm" data-act="delete">${icon('trash')} حذف</button>`);

        <h3 class="mb-8">التقييم الختامي</h3>
        <p class="muted small mb-16">قيّم كل محور من 1 (ضعيف) إلى 5 (ممتاز).</p>
        ${EVALUATION_CRITERIA.map((c) => `
          <div class="field">
            <label>${c.label}</label>
            <div class="scale-row" data-erow="${c.key}">${[1, 2, 3, 4, 5].map((n) => `<div class="scale-opt" data-value="${n}">${n}</div>`).join('')}</div>
          </div>`).join('')}

          <label>بعد انتهاء التجربة، كيف تقيّم درجة التفويض التي تم اختيارها؟</label>
          <div class="choice-group" id="levelfit-group">

function renderFollowUp (outlet) {
  const active = APP_STATE.delegations.filter((d) => d.status === 'active' || d.status === 'paused');
  const items = [];
  active.forEach((d) => (d.checkpoints || []).forEach((cp) => {
    const displayStatus = cp.status || (cp.date && cp.date < todayStr() ? 'متأخرة' : 'مجدولة');
    items.push({ delegation: d, checkpoint: cp, displayStatus });
  }));
  items.sort((a, b) => (a.checkpoint.date || '9999').localeCompare(b.checkpoint.date || '9999'));

  const filters = ['الكل', 'متأخرة', 'تحتاج دعمًا', 'ظهر استثناء', 'مجدولة', 'مكتملة'];
  const current = APP_STATE.followUpFilter || 'الكل';
  const filtered = current === 'الكل' ? items : items.filter((i) => i.displayStatus === current);

  outlet.innerHTML = `
    <div class="section-head">
      <div><h1>المتابعة</h1><div class="desc">جميع نقاط المتابعة القادمة والمتأخرة عبر التفويضات الفعّالة والمعلّقة</div></div>
    </div>
    <div class="pill-wrap mb-16" id="fu-filter-pills">
      ${filters.map((f) => `<label class="checkbox-pill ${current === f ? 'selected' : ''}" data-f="${f}">${f}</label>`).join('')}
    </div>
    <div class="list-cards" id="fu-global-list"></div>
  `;
  qsa('#fu-filter-pills .checkbox-pill').forEach((pill) => pill.addEventListener('click', () => { APP_STATE.followUpFilter = pill.dataset.f; renderFollowUp(outlet); }));

  const listEl = qs('#fu-global-list');
  if (!filtered.length) {
    listEl.innerHTML = `<div class="empty-state"><div class="es-icon">${icon('followup')}</div><h3>لا توجد نقاط متابعة مطابقة</h3><p>أضف نقاط متابعة من داخل صفحة أي تفويض فعّال.</p></div>`;
    return;
  }
  listEl.innerHTML = filtered.map((it) => `
    <div class="deleg-card" data-id="${it.delegation.id}">
      <div class="dc-level">${it.delegation.chosenLevel || '—'}</div>
      <div class="dc-main">
        <div class="dc-title">${escapeHtml(it.checkpoint.topic)}</div>
        <div class="dc-meta">
          <span>${escapeHtml(it.delegation.task.name)}</span>
          <span>${icon('users')} ${escapeHtml(it.delegation.delegatee.name)}</span>
          <span>${it.checkpoint.date ? formatDateShort(it.checkpoint.date) : 'بلا تاريخ محدد'}</span>
        </div>
      </div>
      <div class="dc-badges"><span class="badge ${CHECKPOINT_STATUS_BADGE[it.displayStatus] || 'badge-muted'}">${it.displayStatus}</span></div>
    </div>`).join('');
  qsa('.deleg-card', listEl).forEach((cardEl) => cardEl.addEventListener('click', () => { APP_STATE.pendingTab = 'followup'; navigate(`#/delegations/${cardEl.dataset.id}`); }));
}

   ============================================================ */

const REPORTS_FILTER_STATE = { from: '', to: '', delegatee: '', status: '', level: '', department: '' };

function applyReportFilters () {
  let list = APP_STATE.delegations.slice();
  const f = REPORTS_FILTER_STATE;
  if (f.from) list = list.filter((d) => (d.createdAt || '').slice(0, 10) >= f.from);
  if (f.to) list = list.filter((d) => (d.createdAt || '').slice(0, 10) <= f.to);
  if (f.delegatee) list = list.filter((d) => d.delegatee && d.delegatee.name === f.delegatee);
  if (f.status) list = list.filter((d) => d.status === f.status);
  if (f.level) list = list.filter((d) => d.chosenLevel === Number(f.level));
  if (f.department) list = list.filter((d) => d.task && d.task.department === f.department);
  return list;
}

function renderReports (outlet) {
  const distinctDelegatees = Array.from(new Set(APP_STATE.delegations.map((d) => d.delegatee && d.delegatee.name).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'ar'));
  const distinctDepartments = Array.from(new Set(APP_STATE.delegations.map((d) => d.task && d.task.department).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'ar'));

  outlet.innerHTML = `
    <div class="section-head">
      <div><h1>لوحة التقارير</h1><div class="desc">تحليل شامل لممارسة التفويض داخل نطاقك القيادي</div></div>
      <button class="btn btn-primary" id="rp-full-report">${icon('fileText')} إنشاء التقرير الشامل</button>
    </div>

    <div class="card pad-sm mb-16">

function kpiTile (label, value) {

}

function withPrintRoot (html) {

}

function printHeaderHtml (title, sub) {

    ${sub ? `<div class="print-sub">${escapeHtml(sub)}</div>` : ''}

function printFooterHtml () {

/* ---------------- طباعة تقرير عملية تفويض واحدة ---------------- */
function printDelegationReport (record) {
  const c = record.delegationContract || {};
  const step = typeof record.chosenLevel === 'number' ? ladderStep(record.chosenLevel) : null;

  const interventionsRows = (record.interventions || []).map((iv) => `<tr><td>${formatDateShort(iv.date)}</td><td>${escapeHtml(iv.reason)}</td><td>${escapeHtml(iv.action || '—')}</td></tr>`).join('') || '<tr><td colspan="3">لا توجد تدخلات مسجّلة</td></tr>';

  const evalBlock = record.finalEvaluation && !record.finalEvaluation.skipped ? `
    <h4>التقييم الختامي</h4>
    <div class="kpi-strip">
      <div class="kpi-mini"><b>${record.finalEvaluation.average}</b>متوسط جودة التنفيذ (من 5)</div>
      <div class="kpi-mini"><b>${(LEVEL_FIT_OPTIONS.find((o) => o.key === record.finalEvaluation.levelFit) || {}).label || '—'}</b>ملاءمة الدرجة</div>
    </div>
    <table><thead><tr><th>المحور</th><th>التقييم</th></tr></thead><tbody>
      ${EVALUATION_CRITERIA.map((cr) => `<tr><td>${cr.label}</td><td>${record.finalEvaluation.ratings[cr.key] || '—'} / 5</td></tr>`).join('')}
    </tbody></table>
    ${record.nextRecommendation ? `<h4>التوصية للمهمة المشابهة القادمة</h4><p>${escapeHtml(record.nextRecommendation.text)}</p>` : ''}
  ` : (record.finalEvaluation && record.finalEvaluation.skipped ? '<p>تم إكمال هذه العملية دون تسجيل تقييم مفصّل.</p>' : '<p>لم تكتمل هذه العملية بعد.</p>');

  const html = `
    ${printHeaderHtml('تقرير عملية تفويض', record.task.name)}
    <h4>المهمة والمفوَّض إليه</h4>
    <table><tbody>
      <tr><td>اسم المهمة</td><td>${escapeHtml(record.task.name)}</td></tr>
      <tr><td>النتيجة المطلوبة</td><td>${escapeHtml(record.task.desiredOutcome)}</td></tr>
      <tr><td>المفوَّض إليه</td><td>${escapeHtml(record.delegatee.name)} — ${escapeHtml(record.delegatee.title || '—')}</td></tr>
      <tr><td>الفترة</td><td>${formatDateShort(record.task.startDate)} — ${formatDateShort(record.task.targetDate)}</td></tr>
      <tr><td>الحالة</td><td>${STATUS_LABELS_AR[record.status]}</td></tr>
    </tbody></table>

    <h4>درجة التفويض</h4>
    <table><tbody>
      <tr><td>الدرجة المقترحة</td><td>${recStep ? recStep.level + ' — ' + recStep.title : '—'}</td></tr>
      <tr><td>الدرجة المعتمدة</td><td>${step ? step.level + ' — ' + step.title : '—'}</td></tr>
      <tr><td>سبب التعديل</td><td>${record.overrideReason ? escapeHtml(record.overrideReason.category) + (record.overrideReason.note ? ' — ' + escapeHtml(record.overrideReason.note) : '') : 'لا يوجد تعديل — تم اعتماد التوصية'}</td></tr>
      <tr><td>مخاطرة المهمة</td><td>${RISK_LABELS_AR[record.taskAssessment.risk]} — ${escapeHtml(record.taskAssessment.riskExplanation || '')}</td></tr>
      <tr><td>جاهزية المفوَّض إليه</td><td>${READINESS_LABELS_AR[record.readinessAssessment.readiness]} — ${escapeHtml(record.readinessAssessment.readinessExplanation || '')}</td></tr>
      <tr><td>بوابة الصلاحية</td><td>${(AUTHORITY_GATE_OPTIONS.find((o) => o.key === record.authorityGate.type) || {}).label || '—'}</td></tr>

/* ---------------- طباعة التقرير الشامل للمحفظة ---------------- */
function generatePortfolioRecommendations (a) {
  const recs = [];
  if (a.completenessRate < 70) recs.push('نسبة اكتمال عقود التفويض أقل من المستحسن؛ راجع العناصر الناقصة (النتيجة، النطاق، الصلاحيات، حدود الرجوع، الموارد، معيار النجاح) قبل بدء التنفيذ في العمليات القادمة.');
  if (a.avgInterventions >= 2) recs.push('متوسط تدخلات القائد مرتفع نسبيًا؛ راجع أكثر أسباب التدخل تكرارًا وحاول معالجتها من خلال عقد تفويض أوضح.');
  const fitTotal = a.fitTotal || 0;
  if (fitTotal) {
    if ((a.fitCounts.below / fitTotal) >= 0.4) recs.push('نسبة معتبرة من التقييمات تشير إلى أن الدرجة كانت أقل من المناسب؛ فكّر في توسيع مساحة الاستقلالية تدريجيًا مع من أثبتوا جاهزية جيدة.');
    if ((a.fitCounts.above / fitTotal) >= 0.4) recs.push('نسبة معتبرة من التقييمات تشير إلى أن الدرجة كانت أعلى من المناسب؛ راجع مستوى الدعم ونقاط التحقق قبل رفع الدرجة مستقبلًا.');
  }
  if (a.overdueCount > 0) recs.push(`توجد ${a.overdueCount} عملية تفويض فعّالة بها نقاط متابعة متأخرة أو تحتاج دعمًا؛ يُنصح بمراجعتها في أقرب وقت.`);
  if (!recs.length) recs.push('لا توجد فرص تحسين بارزة حاليًا؛ استمر في متابعة نمط التفويض دوريًا.');
  return recs;
}

function printPortfolioReport (list, filters) {
  const a = calculateAnalytics(list);
  const insights = generateLeadershipInsights(list);
  const recs = generatePortfolioRecommendations(a);
  const periodText = (filters && (filters.from || filters.to)) ? `${filters.from ? formatDateShort(filters.from) : 'البداية'} — ${filters.to ? formatDateShort(filters.to) : 'اليوم'}` : 'كامل السجل المتاح';

  const rows = list.slice(0, 200).map((d) => `<tr>
    <td>${escapeHtml(d.task.name)}</td><td>${escapeHtml(d.delegatee.name)}</td><td>${STATUS_LABELS_AR[d.status]}</td>
    <td>${typeof d.chosenLevel === 'number' ? d.chosenLevel : '—'}</td>
    <td>${d.taskAssessment ? RISK_LABELS_AR[d.taskAssessment.risk] : '—'}</td>
    <td>${formatDateShort(d.createdAt)}</td>
  </tr>`).join('');

  const html = `
    ${printHeaderHtml('التقرير الشامل لمحفظة التفويضات', 'الفترة: ' + periodText)}
    <div class="kpi-strip">
      <div class="kpi-mini"><b>${a.total}</b>إجمالي التفويضات</div>
      <div class="kpi-mini"><b>${a.byStatus.active || 0}</b>فعّالة</div>
      <div class="kpi-mini"><b>${a.byStatus.completed || 0}</b>مكتملة</div>
      <div class="kpi-mini"><b>${a.avgLevel || '—'}</b>متوسط الدرجة</div>
      <div class="kpi-mini"><b>${a.avgInterventions}</b>متوسط التدخلات</div>
      <div class="kpi-mini"><b>${a.completenessRate}%</b>اكتمال العقود</div>
      <div class="kpi-mini"><b>${a.avgQuality || '—'}</b>متوسط جودة التنفيذ</div>
    </div>

    <h4>توزيع درجات التفويض</h4>
    <table><thead><tr>${a.levelDist.map((d) => `<th>${d.level}</th>`).join('')}</tr></thead><tbody><tr>${a.levelDist.map((d) => `<td>${d.count}</td>`).join('')}</tr></tbody></table>

    <h4>أسباب تدخل القائد</h4>
    <table><thead><tr><th>السبب</th><th>عدد المرات</th></tr></thead><tbody>
      ${Object.entries(a.reasonCounts).filter(([, v]) => v > 0).sort((x, y) => y[1] - x[1]).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('') || '<tr><td colspan="2">لا توجد تدخلات مسجّلة</td></tr>'}
    </tbody></table>

    <h4>قراءة قيادية</h4>
    <ul>${insights.map((t) => `<li>${escapeHtml(t)}</li>`).join('')}</ul>

    <h4>فرص التحسين والتوصيات</h4>
    <ul>${recs.map((t) => `<li>${escapeHtml(t)}</li>`).join('')}</ul>

    <h4>جدول العمليات (أول ${Math.min(200, list.length)} من ${list.length})</h4>
    <table><thead><tr><th>المهمة</th><th>المفوَّض إليه</th><th>الحالة</th><th>الدرجة</th><th>المخاطرة</th><th>الإنشاء</th></tr></thead><tbody>${rows}</tbody></table>

    ${printFooterHtml()}
  `;
  withPrintRoot(html);
}

function renderBackup (outlet) {
  outlet.innerHTML = `
    <div class="section-head"><div><h1>النسخ الاحتياطي</h1><div class="desc">إدارة نسخ بياناتك المحفوظة محليًا</div></div></div>

    <div class="callout info mb-16">
      ${icon('lock')}
      <div>
        تُحفظ بيانات عمليات التفويض محليًا على جهازك داخل هذا المتصفح (IndexedDB). لا يتم إرسال البيانات إلى أي خادم خارجي في هذه النسخة، ولا توجد مزامنة سحابية.
        قد يؤدي حذف بيانات المتصفح أو تغيير الجهاز إلى فقد البيانات إذا لم تُصدَّر نسخة احتياطية مسبقًا. ننصح بتصدير نسخة احتياطية بصورة دورية.
      </div>
    </div>

    <div class="grid grid-2 mb-16">
      <div class="card">
        <h3 class="mb-8">${icon('backup')} تصدير نسخة احتياطية</h3>
        <p class="muted small mb-16">ملف JSON يحتوي جميع عمليات التفويض المسجّلة، برقم إصدار للبنية وتاريخ التصدير.</p>
        <button class="btn btn-primary" id="btn-export-json">تصدير نسخة احتياطية (JSON)</button>
      </div>
      <div class="card">
        <h3 class="mb-8">${icon('fileText')} استيراد نسخة احتياطية</h3>
        <p class="muted small mb-16">اختر ملف JSON تم تصديره مسبقًا من هذه الأداة.</p>
        <input type="file" id="backup-file-input" accept="application/json,.json" hidden>
        <button class="btn btn-secondary" id="btn-import-json">اختيار ملف واستيراد</button>
      </div>
    </div>

    <div class="card mb-16">
      <h3 class="mb-8">${icon('fileText')} تصدير CSV</h3>
      <p class="muted small mb-16">سجل مختصر لجميع التفويضات بصيغة CSV، مناسب للفتح في برامج الجداول.</p>
      <button class="btn btn-secondary" id="btn-export-csv">تصدير CSV</button>
    </div>

    <div class="card">
      <h3 class="mb-8">${icon('shield')} الخصوصية</h3>
      <p class="small muted">تُحفظ بياناتك على هذا الجهاز فقط، ولا تشاركها الأداة مع أي طرف آخر. عند مسح بيانات المتصفح أو الانتقال إلى جهاز جديد، لن تكون البيانات متاحة إلا إذا استعدتها من نسخة احتياطية مصدَّرة.</p>
    </div>
  `;

  qs('#btn-export-json').addEventListener('click', async () => {
    try { await exportBackup(); showToast('تم تصدير النسخة الاحتياطية بنجاح.'); }
    catch (e) { showToast('تعذر تصدير النسخة الاحتياطية: ' + e.message, 'danger'); }
  });
  qs('#btn-export-csv').addEventListener('click', async () => {
    try { await exportCSV(); showToast('تم تصدير ملف CSV بنجاح.'); }
    catch (e) { showToast('تعذر تصدير CSV: ' + e.message, 'danger'); }
  });

  const fileInput = qs('#backup-file-input');
  qs('#btn-import-json').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(reader.result); }
      catch (e) { showToast('الملف ليس بصيغة JSON صحيحة.', 'danger'); fileInput.value = ''; return; }
      const check = validateBackupPayload(data);
      if (!check.valid) { showToast('الملف غير صالح: ' + check.errors.join(' — '), 'danger'); fileInput.value = ''; return; }
      openImportChoiceModal(data);
      fileInput.value = '';
    };
    reader.readAsText(file, 'utf-8');
  });

  function openImportChoiceModal (data) {
    const html = `
      <h3>استيراد نسخة احتياطية</h3>
      <p class="muted">يحتوي الملف على <strong>${data.delegations.length}</strong> عملية تفويض، مقابل <strong>${APP_STATE.delegations.length}</strong> عملية محفوظة حاليًا على هذا الجهاز. كيف تريد المتابعة؟</p>
      <div class="choice-group mb-16">
        <label class="choice-card selected" data-mode="merge"><input type="radio" name="import-mode" checked><div><div class="cc-title">دمج مع البيانات الحالية</div><div class="cc-desc">تُضاف عمليات الملف إلى بياناتك الحالية دون حذف أي شيء.</div></div></label>
        <label class="choice-card" data-mode="replace"><input type="radio" name="import-mode"><div><div class="cc-title">استبدال البيانات الحالية</div><div class="cc-desc">سيُحذف كل ما هو محفوظ حاليًا ويُستبدل بمحتوى الملف بالكامل.</div></div></label>
      </div>
      <div class="modal-actions"><button class="btn btn-secondary" data-close>إلغاء</button><button class="btn btn-primary" id="do-import">متابعة</button></div>
    `;
    const overlay = openModal(html, { wide: true });
    let mode = 'merge';
    qsa('.choice-card', overlay).forEach((cardEl) => cardEl.addEventListener('click', () => {
      qsa('.choice-card', overlay).forEach((c) => c.classList.remove('selected'));
      cardEl.classList.add('selected'); qs('input', cardEl).checked = true;
      mode = cardEl.dataset.mode;
    }));
    qs('[data-close]', overlay).addEventListener('click', closeModal);
    qs('#do-import', overlay).addEventListener('click', () => {
      if (mode === 'replace') {
        closeModal();
        confirmAction({
          title: 'تأكيد الاستبدال الكامل',
          body: `سيتم حذف جميع عمليات التفويض المحفوظة حاليًا (${APP_STATE.delegations.length} عملية) نهائيًا واستبدالها بمحتوى الملف. هذا الإجراء لا يمكن التراجع عنه.`,
          danger: true, confirmLabel: 'استبدال نهائيًا',
          onConfirm: () => doImport(data, 'replace')
        });
      } else {
        closeModal();
        doImport(data, 'merge');
      }
    });
  }

  async function doImport (data, mode) {
    try {
      const res = await importBackup(data, mode);
      await refreshDelegationsCache();
      showToast(`تم استيراد ${res.imported} عملية تفويض (${mode === 'replace' ? 'استبدال' : 'دمج'}).`);
      renderBackup(outlet);
    } catch (e) {
      showToast('تعذر الاستيراد: ' + e.message, 'danger');
    }
  }
}
